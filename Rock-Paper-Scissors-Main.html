<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="Icons/WebLogo.png">
    <title>ROCK PAPER SCISSORS | Main</title>
    <link rel="stylesheet" href="Css/Rock-Paper-Scissors-Game/Main-Window/PC.css" media="(max-width:5000px)">
    <link rel="stylesheet" href="Css/Rock-Paper-Scissors-Game/Main-Window/Laptop.css" media="(max-width:1200px)">
    <link rel="stylesheet" href="Css/Rock-Paper-Scissors-Game/Main-Window/taplet.css" media="(max-width:992px)">
    <link rel="stylesheet" href="Css/Rock-Paper-Scissors-Game/Main-Window/SmartPhone.css" media="(max-width:720px)">
    <link rel="stylesheet" href="Css/Rock-Paper-Scissors-Game/Main-Window/PhoneV2.css" media="(max-width:480px)">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <main class="game-container">
    <header class="game-header">
      <h1>حجر ورقة مقص</h1>
    </header>
    <section class="game-card">
      <h2>اختر وضع اللعب:</h2>
      <div class="mode-options">
        <label class="mode-option selected">
          <input type="radio" name="play_mode" value="computer" checked>
            <span class="radio-circle"></span>
            <span class="mode-icon">💻</span>
            <span class="mode-text">
              <strong>اللعب ضد الكمبيوتر</strong>
            </span>
        </label>
        <label class="mode-option">
          <input type="radio" name="play_mode" value="friend">
            <span class="radio-circle"></span>
            <span class="mode-icon">👥</span>
            <span class="mode-text">
              <strong>اللعب مع صديق</strong>
            </span>
        </label>
      </div>
    </section>
      <footer class="game-actions">
        <button type="button" class="btn btn-back">
          <span>⌂</span>الرجوع للقائمة الرئيسية
        </button>
        <button type="button" class="btn btn-start">
          <span>▶</span> ابدأ اللعب
        </button>
      </footer>
      <p class="footer-note">
        ✨ حظًا موفقًا! ولتبدأ المنافسة ✨
      </p>
  </main>
  <script src="Js/Rock-Paper-Scissors-Main.js"></script>
</body>
</html>
